
<!DOCTYPE html>
<html>
<head>
    <title>Methods and Loops</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            margin: auto;
        }

        h1 {
            color: #38bdf8;
        }

        button {
            background: #0ea5e9;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            font-size: 16px;
        }

        button:hover {
            background: #0284c7;
        }

        .result {
            background: #334155;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Methods and Loops</h1>

    <h3>Number List</h3>
    <button onclick="listNumbers()">Show Numbers</button>

    <div class="result" id="numbers">
        Numbers will appear here.
    </div>

    <h3>Random Number and Day</h3>
    <button onclick="showRandomDay()">Pick Random Number</button>

    <div class="result" id="day">
        Your day will appear here.
    </div>

</div>

<script>

function listNumbers() {

    let output = "";

    for (let i = 1; i <= 10; i++) {
        output += i + " ";
    }

    document.getElementById("numbers").innerHTML = output;
}


y
function showRandomDay() {

    let randomNumber = Math.floor(Math.random() * 7) + 1;
    let day;

    switch (randomNumber) {

        case 1:
            day = "Monday";
            break;

        case 2:
            day = "Tuesday";
            break;

        case 3:
            day = "Wednesday";
            break;

        case 4:
            day = "Thursday";
            break;

        case 5:
            day = "Friday";
            break;

        case 6:
            day = "Saturday";
            break;

        case 7:
            day = "Sunday";
            break;
    }

    document.getElementById("day").innerHTML =
        "Random Number: " + randomNumber +
        "<br>Day: " + day;
}

</script>

</body>
</html>
